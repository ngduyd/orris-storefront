services:
  db:
    image: postgres:16-alpine
    container_name: shopify-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: shopify
      POSTGRES_PASSWORD: shopify
      POSTGRES_DB: shopify
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - ./.pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopify -d shopify"]
      interval: 5s
      timeout: 3s
      retries: 10
