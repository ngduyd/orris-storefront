name: Release

on:
  push:
    branches: [master]
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the app image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          target: runner
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/orris-storefront:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/orris-storefront:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/orris-storefront:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # the migration service needs drizzle-kit, which the runner image does not ship
      - name: Build and push the migrator image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          target: migrator
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/orris-storefront:${{ github.sha }}-migrator
            ghcr.io/${{ github.repository_owner }}/orris-storefront:${{ github.ref_name }}-migrator
            ghcr.io/${{ github.repository_owner }}/orris-storefront:migrator
          cache-from: type=gha
          cache-to: type=gha,mode=max

  vercel:
    # Vercel builds from source itself; this job only pushes the current commit to production
    needs: build
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Pull the Vercel project settings
        if: env.VERCEL_PROJECT_ID != ''
        working-directory: web
        run: npx --yes vercel@latest pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for Vercel
        if: env.VERCEL_PROJECT_ID != ''
        working-directory: web
        run: npx --yes vercel@latest build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        if: env.VERCEL_PROJECT_ID != ''
        working-directory: web
        run: npx --yes vercel@latest deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # secrets are not allowed in a job-level `if`; expose them as env and test that instead
    env:
      SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        if: env.SSH_HOST != ''
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST \
            "cd ~/app && ./scripts/deploy.sh"
