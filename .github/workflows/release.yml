name: Release

on:
  # master is the ship branch: merging into it runs the checks, publishes the images and deploys to
  # Vercel. A tag is only a marker for a release, it does not deploy anything.
  push:
    branches: [master]

jobs:
  checks:
    # same tests/lint/typecheck as CI; master never reaches a build or a deployment unless this passes
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the app image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          target: runner
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/orris-storefront:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/orris-storefront:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/orris-storefront:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # the migration service needs drizzle-kit, which the runner image does not ship
      - name: Build and push the migrator image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          target: migrator
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/orris-storefront:${{ github.sha }}-migrator
            ghcr.io/${{ github.repository_owner }}/orris-storefront:${{ github.ref_name }}-migrator
            ghcr.io/${{ github.repository_owner }}/orris-storefront:migrator
          cache-from: type=gha
          cache-to: type=gha,mode=max
