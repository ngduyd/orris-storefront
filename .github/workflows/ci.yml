name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shopify
          POSTGRES_PASSWORD: shopify
          POSTGRES_DB: shopify
        options: >-
          --health-cmd "pg_isready -U shopify -d shopify"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Enable pg_trgm extension
        run: PGPASSWORD=shopify psql -h localhost -U shopify -d shopify -f init-extensions.sql

      - name: Push schema
        run: npm run db:push
        env:
          DATABASE_URL: postgres://shopify:shopify@localhost:5432/shopify

      - name: Seed test fixtures
        run: npx tsx scripts/seed-test.ts
        env:
          DATABASE_URL: postgres://shopify:shopify@localhost:5432/shopify

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          DATABASE_URL: postgres://shopify:shopify@localhost:5432/shopify

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgres://shopify:shopify@localhost:5432/shopify
          CLOUDINARY_CLOUD: ci-placeholder
