<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ORRIS">
  <rect width="64" height="64" fill="#f7f4ef"/>
  <!-- O: a brass ring, the initial of ORRIS, readable down to 16px -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="#b08d57" stroke-width="7"/>
  <!-- ink pupil: the bottle in the ring, the one dark note in the mark -->
  <circle cx="32" cy="32" r="6.5" fill="#12100e"/>
</svg>
