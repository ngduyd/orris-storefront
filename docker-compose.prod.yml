services:
  db:
    image: postgres:16-alpine
    container_name: orris-prod-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shopify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopify}
      POSTGRES_DB: ${POSTGRES_DB:-shopify}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shopify} -d ${POSTGRES_DB:-shopify} && psql -U ${POSTGRES_USER:-shopify} -d ${POSTGRES_DB:-shopify} -tAc \"SELECT 1 FROM pg_extension WHERE extname='pg_trgm'\" | grep -q 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    # published by release.yml; this file only pulls, it never builds
    image: ${ORRIS_MIGRATOR_IMAGE:-ghcr.io/ngduyd/orris-storefront:migrator}
    container_name: orris-prod-migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # an explicit DATABASE_URL in .env.production wins; otherwise it is derived from POSTGRES_*
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-shopify}:${POSTGRES_PASSWORD:-shopify}@db:5432/${POSTGRES_DB:-shopify}}

  app:
    image: ${ORRIS_IMAGE:-ghcr.io/ngduyd/orris-storefront:latest}
    container_name: orris-prod-app
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - path: .env.production
        required: false
    environment:
      # an explicit DATABASE_URL in .env.production wins; otherwise it is derived from POSTGRES_*
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-shopify}:${POSTGRES_PASSWORD:-shopify}@db:5432/${POSTGRES_DB:-shopify}}
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      # only nginx on the host reaches the app; nothing else can hit 3000 directly
      - "127.0.0.1:3000:3000"
    # volumes:
    #   - ./data/images_norm:/app/public/images:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  pgdata:
