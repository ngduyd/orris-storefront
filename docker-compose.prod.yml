services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shopify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopify}
      POSTGRES_DB: ${POSTGRES_DB:-shopify}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      # pg_trgm is verified by the migrate step, not here: a volume that predates the init script
      # would otherwise keep the container unhealthy forever and block the app
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shopify} -d ${POSTGRES_DB:-shopify}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  migrate:
    # one-shot: started with `run --rm migrate`, and `up` is always given explicit services
    # (db app) so it is never pulled in as a long-running container
    image: ${ORRIS_MIGRATOR_IMAGE:-ghcr.io/ngduyd/orris-storefront:migrator}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # declared in .env; nested defaults like ${A:-${B}} are not expanded by podman-compose
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}

  app:
    image: ${ORRIS_IMAGE:-ghcr.io/ngduyd/orris-storefront:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      # short form on purpose: podman-compose does not understand `- path: ... / required: ...`.
      # Every value lives in .env; compose also reads it for ${...} interpolation.
      - .env
    environment:
      # declared in .env; nested defaults like ${A:-${B}} are not expanded by podman-compose
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      # only nginx on the host reaches the app; nothing else can hit 3000 directly
      - "127.0.0.1:3000:3000"
    # volumes:
    #   - ./data/images_norm:/app/public/images:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  pgdata:
