services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shopify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopify}
      POSTGRES_DB: ${POSTGRES_DB:-shopify}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      # pg_trgm is verified by the migrate step, not here: a volume that predates the init script
      # would otherwise keep the container unhealthy forever and block the app
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shopify} -d ${POSTGRES_DB:-shopify}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  migrate:
    # opt-in: `docker compose run --rm migrate` (or podman) — never started by `up`, because
    # podman-compose hangs waiting on the completion of a one-shot dependency
    profiles: ["migrate"]
    image: ${ORRIS_MIGRATOR_IMAGE:-ghcr.io/ngduyd/orris-storefront:migrator}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # an explicit DATABASE_URL in .env.production wins; otherwise it is derived from POSTGRES_*
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-shopify}:${POSTGRES_PASSWORD:-shopify}@db:5432/${POSTGRES_DB:-shopify}}

  app:
    image: ${ORRIS_IMAGE:-ghcr.io/ngduyd/orris-storefront:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env.production
        required: false
    environment:
      # an explicit DATABASE_URL in .env.production wins; otherwise it is derived from POSTGRES_*
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-shopify}:${POSTGRES_PASSWORD:-shopify}@db:5432/${POSTGRES_DB:-shopify}}
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      # only nginx on the host reaches the app; nothing else can hit 3000 directly
      - "127.0.0.1:3000:3000"
    # volumes:
    #   - ./data/images_norm:/app/public/images:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  pgdata:
